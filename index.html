html,body{margin:0;height:100%;overflow:hidden;background:#9fd3f5;font-family:'WebTag',system-ui,sans-serif}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;color:#fff;text-shadow:0 1px 4px #000;font-size:16px;pointer-events:none;line-height:1.5}
#state{font-size:24px;font-weight:400}
#help{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0008;color:#fff;text-align:center;font-size:16px;line-height:1.7;cursor:pointer}
#help #msg{max-width:520px;padding:20px;background:#000a;border-radius:14px;box-sizing:border-box;max-height:calc(100vh - 130px);overflow-y:auto;overscroll-behavior:contain;position:relative;z-index:1}
@media (max-height:700px){#help #msg{font-size:13px;line-height:1.5;padding:14px}}
#help #cos,#help #mp{max-height:calc(100vh - 130px);overflow-y:auto;box-sizing:border-box;z-index:2}
#VRButton{position:fixed!important;bottom:16px!important;left:50%!important;right:auto!important;transform:translateX(-50%);width:auto!important;min-width:140px;padding:12px 20px!important;z-index:100000!important;opacity:1!important;font-size:15px!important;background:#ffd54a!important;color:#000!important;border:0!important;border-radius:10px!important;cursor:pointer}
#help b{color:#ffd54a;font-weight:400}
#cos{position:fixed;right:16px;top:16px;max-width:230px;padding:14px;border-radius:12px;background:#000b;font-size:14px;text-align:left;cursor:default;line-height:1.5}
#cos button{margin:2px;padding:5px 8px;border:0;border-radius:6px;background:#fff3;color:#fff;cursor:pointer;font-size:13px}
#cos button.on{background:#ffd54a;color:#000}
#cos .sw{display:inline-block;width:22px;height:22px;border-radius:50%;margin:4px 3px;cursor:pointer;border:2px solid transparent}
#cos .sw.on{border-color:#fff}
#mp{position:fixed;left:16px;top:16px;max-width:230px;padding:14px;border-radius:12px;background:#000b;font-size:14px;text-align:left;cursor:default;line-height:1.7}
#mp input{width:130px;padding:4px 6px;border-radius:6px;border:0;font-size:14px}
#mp button{margin:3px 3px 3px 0;padding:5px 9px;border:0;border-radius:6px;background:#ffd54a;color:#000;cursor:pointer;font-size:13px}
#mp #mpstat{color:#9fe3a0;font-size:13px}
#mp #micbtn,#mp #hearbtn,#mp #sfxbtn{margin:4px 4px 0 0;padding:6px 10px;border:0;border-radius:6px;background:#fff3;color:#fff;cursor:pointer;font-size:13px}
#mp #micbtn.on,#mp #hearbtn.on,#mp #sfxbtn.on{background:#9fe3a0;color:#000}
#mp select{padding:4px 6px;border-radius:6px;border:0;font-size:14px}
#mp #gmnote{font-size:12px;color:#ffd54a;line-height:1.3;margin-bottom:4px}
#mp #mptabs{margin-bottom:8px}
#mp #mptabs button{background:#fff3;color:#fff}
#mp #mptabs button.on{background:#ffd54a;color:#000}
#mp #codestat{color:#9fe3a0;font-size:13px}
#play{display:none;padding:20px 32px;background:#000a;border-radius:14px;font-size:24px;line-height:1.5;position:relative;z-index:1}
#play small{font-size:14px;color:#ccc}
body:not(.loading):not(.menu) #play{display:block}
body:not(.loading) #help #msg{display:none}
body:not(.menu) #help #cos,body:not(.menu) #help #mp{display:none}

<script type="module">

// ---------- map collider: real triangle collision for the map mesh ----------
// The old physics only asked "how high is the floor under me?" with one ray pointing down, so walking sideways into a
// stump/tree did nothing until the ray happened to land on top of it (pop up) or start inside it (sink through).
// This collides the body (a sphere) and each hand (a small sphere) against the actual triangles: it can't enter solid

function getMic(){

function wireVoice(id,call){
  const old=voiceCalls.get(id);if(old&&old.call!==call){try{old.call.close()}catch(e){}}
  const v={call,gain:null,el:null};voiceCalls.set(id,v);
  call.on('stream',s=>{
    if(v.gain)return;
    v.el=new Audio();v.el.srcObject=s;v.el.muted=true;v.el.play().catch(()=>{}); // keeps the stream flowing in Chrome; real audio goes through WebAudio
    v.gain=audioCtx.createGain();v.gain.gain.value=0;
    audioCtx.createMediaStreamSource(s).connect(v.gain);v.gain.connect(inMaster);
  });
  const done=()=>{if(voiceCalls.get(id)===v)voiceCalls.delete(id);try{v.gain&&v.gain.disconnect()}catch(e){}};
  call.on('close',done);call.on('error',done);
}
function voiceSync(){
  if(!net||!net.peer)return;
  if(!net.peer._vh){net.peer._vh=1;net.peer.on('call',call=>{call.answer(outDest.stream);wireVoice(key_(call.peer),call)})}
  if(!net.peer.open)return;
  net.conns.forEach((c,cid)=>{
    const id=key_(cid);
    if(!c.open||id===net.peer.id||voiceCalls.has(id)||!remotes.has(id))return;
    if(net.peer.id<id){const call=net.peer.call(id,outDest.stream);if(call)wireVoice(id,call)} // lower id places the call, so there is only ever one per pair
  });
}

    const k=Math.max(0,1-P.g.group.position.distanceTo(r.pos)/VOICE_MAX_DIST);

}

const sfxGain=audioCtx.createGain();sfxGain.gain.value=0.7;sfxGain.connect(audioCtx.destination);sfxGain.connect(recDest);
const noiseBuf=(()=>{const b=audioCtx.createBuffer(1,audioCtx.sampleRate,audioCtx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b})();
const sfxOK=()=>sfxOn&&audioCtx.state==='running';
const distGain=pos=>{const k=Math.max(0,1-P.g.group.position.distanceTo(pos)/VOICE_MAX_DIST);return k*k};
function envl(g,t,a,d,pk){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(pk,0.0002),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function sfxNoise(t,dur,type,f0,f1,vol,q=1){
  const s=audioCtx.createBufferSource();s.buffer=noiseBuf;const f=audioCtx.createBiquadFilter();f.type=type;f.Q.value=q;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=audioCtx.createGain();envl(g,t,0.004,dur,vol);s.connect(f);f.connect(g);g.connect(sfxGain);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);
}
function sfxTone(t,type,f0,f1,dur,vol){
  const o=audioCtx.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=audioCtx.createGain();envl(g,t,0.005,dur,vol);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+dur+0.05);
}

function sfxTag(vol=1){if(!sfxOK()||vol<0.02)return;const t=audioCtx.currentTime;sfxTone(t,'sawtooth',750,140,0.3,0.5*vol);sfxTone(t+0.02,'square',380,90,0.32,0.25*vol);sfxNoise(t,0.1,'highpass',2500,2500,0.25*vol)}
function sfxStart(){if(!sfxOK())return;const t=audioCtx.currentTime;[440,660,880].forEach((f,i)=>sfxTone(t+i*0.13,'triangle',f,f,0.14,0.35))}
function sfxOver(){if(!sfxOK())return;const t=audioCtx.currentTime;[880,660,440,330].forEach((f,i)=>sfxTone(t+i*0.14,'triangle',f,f,0.16,0.35))}

function startRound(){

  game.ls=ids.length>=4;game.tagged=new Set([ids[Math.floor(Math.random()*ids.length)]]);game.eliminated.clear();game.winner=null;game.phase='play';game.hsEnd=performance.now()+HEAD_START;

function playersInfo(){
  const w=k=>P.g.rig.wrist[k].getWorldPosition(V()),me={id:myId(),pos:P.g.group.position.clone(),hands:[w(0),w(1)]};
  return [me,...[...remotes].map(([id,r])=>({id,pos:r.pos,hands:r.h}))];

function hostTick(dt){
  game.syncT-=dt;if(game.syncT<=0){game.syncT=2;netSend(gameState())}   // re-broadcast now and then so nobody gets stuck out of sync
  if(game.mode!=='tag')return;
  const ids=allIds(),now=performance.now();
  [...game.tagged].forEach(id=>{if(!ids.includes(id))game.tagged.delete(id)});
  [...game.eliminated].forEach(id=>{if(!ids.includes(id))game.eliminated.delete(id)}); // players who left no longer count as eliminated
  if(game.phase==='wait'){if(ids.length>=2)startRound();return}
  if(game.phase==='over'){if(now>game.overAt)startRound();return}
  if(ids.length<2){game.phase='wait';game.tagged.clear();game.eliminated.clear();game.winner=null;sendGame();return}
  if(game.tagged.size===0){startRound();return}
  if(now<game.hsEnd)return;   // the first tagged player gets a short head start
  const pl=playersInfo(),survivors=pl.filter(p=>!game.eliminated.has(p.id));
  // With four players, a tagged player is out. With three or fewer, tag spreads like infection.
  for(const a of survivors)if(game.tagged.has(a.id)&&(!lastStanding()||!game.eliminated.has(a.id)))for(const b of survivors){
    if(a.id===b.id||game.tagged.has(b.id)||game.eliminated.has(b.id))continue;
    if(a.pos.distanceTo(b.pos)<TAG_DIST||a.hands.some(h=>h.distanceTo(b.pos)<HAND_TAG)){
      if(lastStanding())game.eliminated.add(b.id);else game.tagged.add(b.id);
      sendGame({ev:'tag',v:b.id});
      if(lastStanding()&&ids.length-game.eliminated.size<=1){game.winner=pl.find(p=>!game.eliminated.has(p.id))?.id||a.id;game.phase='over';game.msg='Last one standing wins!';game.overAt=now+OVER_TIME;sendGame({ev:'over'})}
      else if(!lastStanding()&&game.tagged.size>=ids.length){game.msg='Everyone is tagged! Keep playing';sendGame()}
      return}}
}

// adds one gorilla (fresh copy of Playermodel.glb) + its animation tracks to the export
function mocapActor(exScene,tracks,g,label,times,data,total,pad,stick){
  const model=clone(playerGltf.scene),root=new THREE.Group();root.name=label;root.add(model);exScene.add(root);
  const bones=[];model.traverse(o=>{if(o.isBone)bones.push(o)});
  if(bones.length!==data[0].length/10-1)throw new Error('bone count mismatch for '+label);
  // keep that gorilla's current fur color
  const live=[];mocapWalk(g.model,o=>{if(o.isMesh)live.push(o)},g);let mi=0;
  model.traverse(o=>{if(!o.isMesh)return;const l=live[mi++];
    if(l&&!g.tg&&g.furMats.includes(l.material)){o.material=o.material.clone();o.material.color.copy(l.material.color)}});
  let T=Array.from(times),D=Array.from(data);
  if(pad){ // a player who joined late / left early is shrunk to nothing outside the time they were recorded
    const hide=f=>{const z=new Float32Array(f);z[7]=z[8]=z[9]=0;return z};
    if(T[0]>0.002){const z=hide(D[0]);T.unshift(0,T[0]-0.001);D.unshift(z,z)}
    const last=T[T.length-1];
    if(total-last>0.002){const z=hide(D[D.length-1]);T.push(last+0.001,total);D.push(z,z)}
  }
  const n=T.length;
  [root,...bones].forEach((o,j)=>{
    const pv=new Float32Array(n*3),qv=new Float32Array(n*4),sv=new Float32Array(n*3);
    for(let f=0;f<n;f++){const d=D[f],b=j*10;
      pv.set([d[b],d[b+1],d[b+2]],f*3);qv.set([d[b+3],d[b+4],d[b+5],d[b+6]],f*4);sv.set([d[b+7],d[b+8],d[b+9]],f*3)}
    tracks.push(new THREE.VectorKeyframeTrack(o.uuid+'.position',T,pv),
                new THREE.QuaternionKeyframeTrack(o.uuid+'.quaternion',T,qv),
                new THREE.VectorKeyframeTrack(o.uuid+'.scale',T,sv));
  });
}
function mocapExport(){
  if(mocap.busy)return;
  if(mocap.rec)mocapStop();
  const n=mocap.times.length;if(n<2){mocapSay('Record something first');return}
  mocap.busy=true;mocapSay('Building file...');
  // level 0 = everything, 1 = without the map (so a bad piece can't block the whole export)
  const run=lvl=>setTimeout(()=>{try{
    const useMap=mocap.map&&lvl<1;
    const exScene=new THREE.Scene(),tracks=[];
    const t0=mocap.times[0],times=mocap.times.map(t=>t-t0),total=times[n-1];
    mocapActor(exScene,tracks,P.g,'Monke',times,mocap.data,total,false);
    let others=0;
    if(mocap.players)mocap.rem.forEach(e=>{
      if(e.times.length<2)return;
      mocapActor(exScene,tracks,e.g,'Player_'+String(e.name||'Monke').replace(/[^\w-]/g,'_'),e.times.map(t=>Math.max(0,t-t0)),e.data,total,true);others++;
    });
    if(useMap){const m=mapGltf.scene.clone(true);m.name='Map';exScene.add(m)} // same world transform as the live map, so the take lines up with it
    const clip=new THREE.AnimationClip('Mocap',-1,tracks);
    new GLTFExporter().parse(exScene,res=>{
      const stamp=Date.now()+(useMap?'-map':'')+(others?'-players':'');
      if(MOCAP_BINARY)mocapDownload(res,'webtag-mocap-'+stamp+'.glb','model/gltf-binary');
      else mocapDownload(JSON.stringify(res),'webtag-mocap-'+stamp+'.gltf','model/gltf+json');
      mocap.busy=false;mocapSay('Exported '+n+' frames'+(others?' + '+others+' player'+(others>1?'s':''):'')+(lvl>=1?' (map skipped)':''));
    },err=>{console.error(err);if(lvl<1){run(lvl+1);return}mocap.busy=false;mocapSay('Export failed: '+String((err&&err.message)||err).slice(0,40))},
    {binary:MOCAP_BINARY,animations:[clip],trs:true});
  }catch(e){console.error(e);if(lvl<1){run(lvl+1);return}mocap.busy=false;mocapSay('Export failed: '+String(e.message).slice(0,40))}},30);
  run(0);
}

  else if(d.id==='space'){if(kb.mode==='name'&&kb.text.length&&kb.text.length<kb.max&&!kb.text.endsWith(' '))kb.text+=' '}

function kbTick(dt){
  if(!kb.open)return;
  if(!renderer.xr.isPresenting){kb.open=false;kb.g.visible=false;return}
  if(menuOpen)setMenu(false);
  kb.arm=Math.max(0,kb.arm-dt);kb.g.updateMatrixWorld(true);
  kb.keys.forEach(k=>{k.target=k.flash>0?KB_TRAVEL*0.9:0;k.flash-=dt});
  for(let i=0;i<2;i++){
    const gp=gpOfCtrl(i);if(!gp)continue;
    const c=ctrls[i];c.updateMatrixWorld(true);_kO.setFromMatrixPosition(c.matrixWorld);_kD.set(0,0,-1).transformDirection(c.matrixWorld);
    // laser + trigger
    kb.ray.set(_kO,_kD);const hit=kb.ray.intersectObjects(kb.meshes,false)[0];
    lasers[i].visible=true;lasers[i].scale.z=hit?hit.distance/rig.scale.x:2.5;
    const tr=!!(gp.buttons[0]&&gp.buttons[0].pressed),edge=tr&&!kb.prevTrig[i];kb.prevTrig[i]=tr;
    if(edge&&hit&&kb.arm<=0){const k=hit.object.userData.k;k.flash=0.12;kbPress(k,i);if(!kb.open)return}
    // poke: the controller tip pushes the key down; it fires once it is nearly bottomed out
    _kT.copy(_kO).addScaledVector(_kD,0.06*rig.scale.x);kb.g.worldToLocal(_kT);
    if(_kT.z>KB_FRONT-0.012){
      for(const k of kb.keys){
        if(Math.abs(_kT.x-k.x)>k.pw/2||Math.abs(_kT.y-k.y)>k.ph/2)continue;
        const depth=KB_FRONT+KB_KD-_kT.z;
        if(depth>0)k.target=Math.max(k.target,Math.min(depth,KB_TRAVEL));
        if(depth>=KB_TRAVEL*0.75&&!k.down&&kb.arm<=0){k.down=true;kbPress(k,i);if(!kb.open)return}
        break;
      }
    }
  }
  kb.keys.forEach(k=>{if(k.down&&k.target<KB_TRAVEL*0.3)k.down=false;k.off+=(k.target-k.off)*Math.min(1,dt*30);k.mesh.position.z=KB_FRONT+KB_KD/2-k.off});
}

const buzz=(h,a,ms)=>{try{const g=h.src&&h.src.gamepad,p=g&&g.hapticActuators&&g.hapticActuators[0];if(p&&p.pulse)p.pulse(a,ms)}catch(e){}};
const hs=[0,1].map(i=>{
  const h={ctrl:ctrls[i],grip:grips[i],src:null,hold:null,off:new THREE.Matrix4(),prevTrig:false};
  h.ctrl.addEventListener('connected',e=>{h.src=e.data});
  h.ctrl.addEventListener('disconnected',()=>{h.src=null;h.hold=null});
  h.ctrl.addEventListener('squeezestart',()=>grab(h));
  h.ctrl.addEventListener('squeezeend',()=>release(h));
  return h;
});
function grab(h){
  if(h.hold||!renderer.xr.isPresenting||!cm.visible)return;
  rig.updateMatrixWorld(true);cm.updateMatrixWorld(true);h.grip.getWorldPosition(A);
  let best=0,bd=.14*CS;
  for(const s of [-1,1]){
    if(hs.some(o=>o.hold&&o.hold.side===s))continue;
    const d=A.distanceTo(cm.localToWorld(B.set(s*HX,0,0)));if(d<bd){bd=d;best=s}
  }
  if(best){h.hold={side:best};h.off.copy(h.grip.matrixWorld).invert().multiply(cm.matrixWorld);buzz(h,.6,60)}
}
function release(h){
  h.hold=null;rig.updateMatrixWorld(true);
  const o=hs.find(k=>k.hold);if(o)o.off.copy(o.grip.matrixWorld).invert().multiply(cm.matrixWorld);
}
function updateCam(){
  const hh=hs.filter(h=>h.hold);
  if(hh.length===1){MM.multiplyMatrices(hh[0].grip.matrixWorld,hh[0].off);MM.decompose(cm.position,cm.quaternion,TS)}
  else if(hh.length===2){
    const R=hh.find(h=>h.hold.side>0),L=hh.find(h=>h.hold.side<0);
    R.grip.getWorldPosition(A);L.grip.getWorldPosition(B);
    X.subVectors(A,B).normalize();
    U1.set(0,1,0).applyQuaternion(R.grip.getWorldQuaternion(Q));U2.set(0,1,0).applyQuaternion(L.grip.getWorldQuaternion(Q));
    Y.set(0,2,0).add(U1).add(U2);
    Z.crossVectors(X,Y).normalize();Y.crossVectors(Z,X);
    MM.makeBasis(X,Y,Z);cm.quaternion.setFromRotationMatrix(MM);cm.position.addVectors(A,B).multiplyScalar(.5);
  }
  cm.updateMatrixWorld(true);
}

const updNote=()=>{galNote.textContent=galGrid.children.length+' saved in this browser'};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){} // ask the browser not to evict the saved captures
// Captures live in this site's own IndexedDB (name below). A page on another address (another GitHub account, a custom domain, file://)
// has its own empty storage, so use Download all / Import files to carry captures over.
const CAP_DB='monke-tag-captures';
const dbp=new Promise(res=>{try{const r=indexedDB.open(CAP_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('f'))r.result.createObjectStore('f',{keyPath:'name'})};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}});
const putFiles=(db,items)=>new Promise(res=>{try{const tx=db.transaction('f','readwrite'),st=tx.objectStore('f');items.forEach(f=>st.put(f));tx.oncomplete=()=>res(true);tx.onerror=tx.onabort=()=>res(false)}catch(e){res(false)}});
const delFile=name=>dbp.then(db=>{if(db)try{db.transaction('f','readwrite').objectStore('f').delete(name)}catch(e){}});
function addItem(blob,name){
  const url=URL.createObjectURL(blob),d=document.createElement('div'),vid=blob.type.startsWith('video');
  const m=document.createElement(vid?'video':'img');m.src=url;if(vid)m.controls=true;m.style.cssText='width:100%;border-radius:6px';
  const dl=document.createElement('a');dl.textContent='Download';dl.href=url;dl.download=name;dl.style.cssText='color:#ffd54a;margin-right:10px';
  const del=document.createElement('a');del.textContent='Delete';del.href='#';del.style.cssText='color:#ff8a8a';
  del.onclick=e=>{e.preventDefault();if(!confirm('Delete this capture?'))return;delFile(name);URL.revokeObjectURL(url);d.remove();updNote()};
  d.append(m,dl,del);galGrid.prepend(d);updNote();return url;
}
function saveFile(blob,name){
  const url=addItem(blob,name);
  try{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}
  dbp.then(db=>{if(db)putFiles(db,[{name,blob,t:Date.now()}])});
}
galFile.onchange=()=>{
  const files=[...galFile.files].filter(f=>/^(image|video)\//.test(f.type));galFile.value='';
  const items=files.map((f,i)=>({name:'imported-'+Date.now()+'-'+i+'-'+f.name.replace(/[^\w.-]/g,'_').slice(-40),blob:f.slice(0,f.size,f.type),t:Date.now()+i}));
  items.forEach(it=>addItem(it.blob,it.name));
  dbp.then(db=>{if(db)putFiles(db,items)});
};
// older versions stored captures in a database called "gcam"; copy those over once (only if it exists, so we never create an empty one)
async function migrateOld(db){
  try{
    if(!indexedDB.databases)return;
    if(!(await indexedDB.databases()).some(d=>d.name==='gcam'))return;
    const old=await new Promise(res=>{const r=indexedDB.open('gcam');r.onupgradeneeded=()=>{try{r.transaction.abort()}catch(e){}};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)});
    if(!old)return;
    if(!old.objectStoreNames.contains('f')){old.close();return}
    const items=await new Promise(res=>{const q=old.transaction('f').objectStore('f').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])});
    old.close();await putFiles(db,items.filter(f=>f&&f.name&&f.blob));
  }catch(e){}
}
dbp.then(async db=>{
  if(!db){galNote.textContent='Browser storage unavailable: captures only download';return}
  await migrateOld(db);
  const all=await new Promise(res=>{try{const q=db.transaction('f').objectStore('f').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}});
  all.filter(f=>f&&f.blob&&f.name).sort((a,b)=>a.t-b.t).forEach(f=>addItem(f.blob,f.name));updNote();
});
let flash=0,mr=null,chunks=[];
function photo(){
  renderCam();flash=.18;
  cv2.toBlob(b=>{if(b)saveFile(b,'webtag-photo-'+Date.now()+'.jpg')},'image/jpeg',.92);
}
function toggleRec(){
  if(!cst.rec){
    const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
    if(!mime)return;
    chunks=[];if(audioCtx.state!=='running')audioCtx.resume().catch(()=>{});
    const rs=new MediaStream([...cv2.captureStream(30).getVideoTracks(),...recDest.stream.getAudioTracks()]);
    mr=new MediaRecorder(rs,{mimeType:mime,videoBitsPerSecond:5e6,audioBitsPerSecond:128000});
    mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    mr.onstop=()=>{const ty=mime.split(';')[0];saveFile(new Blob(chunks,{type:ty}),'webtag-clip-'+Date.now()+'.'+(ty.includes('mp4')?'mp4':'webm'))};
    mr.start(1000);cst.rec=true;
  }else{mr.stop();cst.rec=false}
}
function press(id){
  if(id==='photo')photo();else if(id==='rec')toggleRec();
  else if(id==='mode')cst.mode=(cst.mode+1)%3;
  else if(id==='flip')cst.mode=cst.mode===2?0:2;
}

/* ---- per-frame ---- */
const rc2=new THREE.Raycaster();rc2.far=3.5;
const aim=[false,false],aimLen=[1,1];let camAcc=0;
camTick=function(dt){
  const xr=renderer.xr.isPresenting;
  if(!ready){cm.visible=false;return} // camera model failed to load: do nothing
  cm.visible=xr;
  if(!xr){hs.forEach(h=>{h.hold=null});placed=false;if(cst.rec)toggleRec();return}
  rig.updateMatrixWorld(true);headPose();
  if(!placed){placeCam();placed=true}
  updateCam();
  // (stick FOV removed - use the FOV-/FOV+ buttons on the camera)
  // laser-press on the camera's buttons (free hand)
  buttons.forEach(b=>b.userData.dn=false);
  for(let i=0;i<2;i++){
    const h=hs[i],gp=h.src&&h.src.gamepad,tr=!!(gp&&gp.buttons[0]&&gp.buttons[0].pressed),edge=tr&&!h.prevTrig;h.prevTrig=tr;
    aim[i]=false;
    if(menuOpen)continue;
    if(h.hold)continue; // holding the camera: the trigger does nothing (no accidental photos)
    h.ctrl.updateMatrixWorld(true);A.setFromMatrixPosition(h.ctrl.matrixWorld);B.set(0,0,-1).transformDirection(h.ctrl.matrixWorld);rc2.set(A,B);
    const hit=rc2.intersectObjects(hitObjs,false)[0];
    if(hit){
      aim[i]=true;aimLen[i]=hit.distance/rig.scale.x;
      const u=hit.object.userData;
      if(u&&u.id){
        u.t=.12;if(tr)u.dn=true; // trigger held on a button = it sinks
        if(u.id==='fovm'){if(tr)cst.fov-=40*dt}
        else if(u.id==='fovp'){if(tr)cst.fov+=40*dt}
        else if(edge){press(u.id);buzz(h,.5,40);u.dip=.1} // dip keeps even a quick tap visibly down for a moment
      }
    }
  }
  for(let i=0;i<2;i++){lasers[i].visible=menuOpen||aim[i];if(!menuOpen&&aim[i])lasers[i].scale.z=aimLen[i]}
  cst.fov=Math.max(15,Math.min(120,cst.fov));
  buttons.forEach(bt=>{
    const u=bt.userData;if(u.t>0)u.t-=dt;
    if(u.dip>0){u.dip-=dt;u.dn=true}
    u.p+=((u.dn?1:0)-u.p)*Math.min(1,dt*28); // quick spring toward pressed / released
    bt.position.copy(u.rest).addScaledVector(u.dir,-BTN_TRAVEL*u.p);
  });
  if(flash>0){flash-=dt;flashM.visible=true;flashM.material.opacity=Math.max(flash/.18,0);if(flash<=0)flashM.visible=false}
  ui();
  // camera screen at ~24fps, only when it's nearby or recording
  camAcc+=dt;
  if(camAcc>=1/24&&(cst.rec||cm.position.distanceTo(hp)<8)){camAcc=0;renderCam()}
};
}

// ---------- hide YOUR OWN head + hat from YOUR camera ----------
// The head is part of the body mesh, so it can't go on a camera layer. Instead the head bone is shrunk to almost nothing
// only while your own first-person view is drawn (the hat is a child of the head bone, so it vanishes too). Other players,
// third person and the mirror still show the head and hat, and the real bone scale is restored right after drawing.
// First-person camera sits at your head bone (it used to sit ~0.3 in FRONT of the head). EYE_OFF nudges it from the bone: x right/left, y up, z forward (body space). Tune these.
const EYE_OFF=V(0,0.17,0.14),_eyeP=V(),_eyeV=V();
let selfHeadHidden=false;const _selfHS=V();
function setSelfHead(hide){
  if(hide===selfHeadHidden)return;
  selfHeadHidden=hide;
  const h=P.g.rig.head;
  if(hide){_selfHS.copy(h.scale);h.scale.multiplyScalar(0.0001)}else h.scale.copy(_selfHS);
  h.updateMatrixWorld(true);
  const seen=new Set();
  P.g.group.traverse(o=>{if(o.isSkinnedMesh&&o.skeleton&&!seen.has(o.skeleton)){seen.add(o.skeleton);o.skeleton.update()}});
}
if(selfMirror){ // the mirror draws its own pass inside renderer.render: show the head for that pass, then hide it again
  const origMirror=selfMirror.onBeforeRender;
  selfMirror.onBeforeRender=function(...a){
    const was=selfHeadHidden;
    if(was)setSelfHead(false);
    origMirror.apply(this,a);
    if(was)setSelfHead(true);
  };
}

const clock=new THREE.Clock();let t=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.max(1e-4,Math.min(clock.getDelta(),1/30));t+=dt; // never 0 (the first frame) so nothing divides by zero
  if(renderer.xr.isPresenting)stepVR(dt);else stepPlayer(dt);
  if(P.g.spin)P.g.spin.rotation.y+=dt*25;
  furTick(t);stepRemotes(dt);mocapTick();netTick(dt);gameTick(dt);voiceTick();vrMenuTick(dt);camTick(dt);kbTick(dt);
  const f=V(-Math.sin(P.yaw),0,-Math.cos(P.yaw));
  if(renderer.xr.isPresenting){}
  else if(P.third){cam.position.copy(P.pos).addScaledVector(f,-3.2*SIZE).add(V(0,1.4*SIZE,0));cam.lookAt(P.pos)}
  else{P.g.rig.head.updateWorldMatrix(true,false);P.g.rig.head.getWorldPosition(_eyeP);_eyeP.add(_eyeV.copy(EYE_OFF).applyQuaternion(P.g.group.quaternion).multiplyScalar(SIZE));cam.position.copy(_eyeP);cam.rotation.set(P.pitch,P.yaw,0,'YXZ')}
  $('sub').textContent=`Speed: ${P.vel.length().toFixed(1)} m/s  gnd:${P.gnd?1:0} proc:${P.proc[0]?1:0}${P.proc[1]?1:0} a:${P.a[0].toFixed(2)},${P.a[1].toFixed(2)}`;
  setSelfHead(!P.third);renderer.render(scene,cam);setSelfHead(false);
});
