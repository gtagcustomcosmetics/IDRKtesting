// Use the actual triangles from the currently loaded map for ground checks.
// This avoids relying on a heightfield sampled from the old map model.
scene.add(mapGltf.scene);
mapGltf.scene.updateMatrixWorld(true);
const mapCollisionMeshes=[];
mapGltf.scene.traverse(o=>{

const groundRayOrigin=V();

  groundRayOrigin.set(x,topY,z);
  groundRaycaster.set(groundRayOrigin,groundRayDirection);

// world-space triangles of the map -> collider
{
  const arr=[],a=V(),b=V(),c=V(),e1=V(),e2=V();
  mapCollisionMeshes.forEach(o=>{
    for(let p=o;p;p=p.parent)if(p.visible===false)return;
    const g=o.geometry,pos=g.attributes.position,idx=g.index,m=o.matrixWorld,n=idx?idx.count:pos.count;

  const mir=new Reflector(new THREE.PlaneGeometry(3,2.2),{clipBias:0.003,textureWidth:1024,textureHeight:768,color:0xdddddd});

  remotes.forEach((r,id)=>{if(now-r.last>15000){net.conns.forEach((c,k)=>{if(key_(k)===id){try{c.close()}catch(e){}net.conns.delete(k);if(isHostKey(k)&&!net.host)claimHost()}});dropRemote(id)}});
  netT-=dt;if(netT>0||!net.conns.size)return;netT=1/15;
  const g=P.g.group,a=P.g.rig.wrist[0].getWorldPosition(V()),b=P.g.rig.wrist[1].getWorldPosition(V());
  netSend({t:'s',p:fl([g.position.x,g.position.y,g.position.z]),r:Math.round(g.rotation.y*100)/100,h:fl([a.x,a.y,a.z,b.x,b.y,b.z]),s:SIZE,hp:Math.round(netHeadPitch*100)/100});
}

// ---------- voice chat: proximity audio over the same PeerJS connections ----------
const VOICE_MAX_DIST=20; // world units; voices fade to silence at this distance
let micOn=true,hearOn=true,sfxOn=true,micOK=null,micStream=null; // micOK: null=asking, true=working, false=denied/unavailable
try{const sv=JSON.parse(localStorage.getItem('monkeAudio')||'{}');if(sv.mic===false)micOn=false;if(sv.hear===false)hearOn=false;if(sv.sfx===false)sfxOn=false}catch(e){}
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
const outDest=audioCtx.createMediaStreamDestination(),outGain=audioCtx.createGain(),inMaster=audioCtx.createGain();
outGain.connect(outDest);inMaster.connect(audioCtx.destination);
const voiceCalls=new Map(); // peer id -> {call,gain,el}
const resumeAudio=()=>{if(audioCtx.state!=='running')audioCtx.resume().catch(()=>{})};
['pointerdown','click','keydown','touchstart'].forEach(ev=>addEventListener(ev,resumeAudio));
renderer.xr.addEventListener('sessionstart',resumeAudio);
function paintVoice(){
  const m=$('micbtn'),h=$('hearbtn'),x=$('sfxbtn');
  m.textContent='\u{1F3A4} Mic: '+(micOn?(micOK===false?'On (no mic)':'On'):'Off');m.classList.toggle('on',micOn);
  h.textContent='\u{1F442} Hear others: '+(hearOn?'On':'Off');h.classList.toggle('on',hearOn);
  x.textContent='\u{1F50A} Sounds: '+(sfxOn?'On':'Off');x.classList.toggle('on',sfxOn);
}
function getMic(){
  if(micStream)return Promise.resolve(micStream);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return Promise.reject(new Error('no mic'));
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false})
    .then(s=>{micStream=s;s.getAudioTracks().forEach(tr=>tr.enabled=micOn);audioCtx.createMediaStreamSource(s).connect(outGain);return s});
}
// Mic = whether others can hear YOU. Hear others = whether YOU hear them. Independent, and remembered.
function saveAudio(){try{localStorage.setItem('monkeAudio',JSON.stringify({mic:micOn,hear:hearOn,sfx:sfxOn}))}catch(e){}}
function applyVoice(){
  outGain.gain.value=micOn?1:0;inMaster.gain.value=hearOn?1:0;
  if(micStream)micStream.getAudioTracks().forEach(tr=>tr.enabled=micOn);
  if(micOn&&!micStream)getMic().then(()=>{micOK=true;paintVoice()}).catch(()=>{micOK=false;paintVoice()});
  paintVoice();
}
function setMic(on){micOn=on;applyVoice();saveAudio()}
function setHear(on){hearOn=on;applyVoice();saveAudio()}
function setSfx(on){sfxOn=on;paintVoice();saveAudio()}
$('micbtn').addEventListener('click',()=>setMic(!micOn));
$('hearbtn').addEventListener('click',()=>setHear(!hearOn));
$('sfxbtn').addEventListener('click',()=>{setSfx(!sfxOn);if(sfxOn)sfxClick()});
function wireVoice(id,call){
  const old=voiceCalls.get(id);if(old&&old.call!==call){try{old.call.close()}catch(e){}}
  const v={call,gain:null,el:null};voiceCalls.set(id,v);
  call.on('stream',s=>{
    if(v.gain)return;
    v.el=new Audio();v.el.srcObject=s;v.el.muted=true;v.el.play().catch(()=>{}); // keeps the stream flowing in Chrome; real audio goes through WebAudio
    v.gain=audioCtx.createGain();v.gain.gain.value=0;
    audioCtx.createMediaStreamSource(s).connect(v.gain);v.gain.connect(inMaster);
  });
  const done=()=>{if(voiceCalls.get(id)===v)voiceCalls.delete(id);try{v.gain&&v.gain.disconnect()}catch(e){}};
  call.on('close',done);call.on('error',done);
}
function voiceSync(){
  if(!net||!net.peer)return;
  if(!net.peer._vh){net.peer._vh=1;net.peer.on('call',call=>{call.answer(outDest.stream);wireVoice(key_(call.peer),call)})}
  if(!net.peer.open)return;
  net.conns.forEach((c,cid)=>{
    const id=key_(cid);
    if(!c.open||id===net.peer.id||voiceCalls.has(id)||!remotes.has(id))return;
    if(net.peer.id<id){const call=net.peer.call(id,outDest.stream);if(call)wireVoice(id,call)} // lower id places the call, so there is only ever one per pair
  });
}
setInterval(voiceSync,1000);
function voiceTick(){
  const now=audioCtx.currentTime;
  voiceCalls.forEach((v,id)=>{
    if(!v.gain)return;const r=remotes.get(id);
    if(!r){v.gain.gain.setTargetAtTime(0,now,.08);return}
    const k=Math.max(0,1-P.g.group.position.distanceTo(r.pos)/VOICE_MAX_DIST);
    v.gain.gain.setTargetAtTime(k*k,now,.08);
  });
}
applyVoice();

// ---------- sound effects (synthesized with WebAudio, no sound files needed) ----------
const sfxGain=audioCtx.createGain();sfxGain.gain.value=0.7;sfxGain.connect(audioCtx.destination);
const noiseBuf=(()=>{const b=audioCtx.createBuffer(1,audioCtx.sampleRate,audioCtx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b})();
const sfxOK=()=>sfxOn&&audioCtx.state==='running';
const distGain=pos=>{const k=Math.max(0,1-P.g.group.position.distanceTo(pos)/VOICE_MAX_DIST);return k*k};
function envl(g,t,a,d,pk){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(pk,0.0002),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function sfxNoise(t,dur,type,f0,f1,vol,q=1){
  const s=audioCtx.createBufferSource();s.buffer=noiseBuf;const f=audioCtx.createBiquadFilter();f.type=type;f.Q.value=q;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=audioCtx.createGain();envl(g,t,0.004,dur,vol);s.connect(f);f.connect(g);g.connect(sfxGain);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);
}
function sfxTone(t,type,f0,f1,dur,vol){
  const o=audioCtx.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=audioCtx.createGain();envl(g,t,0.005,dur,vol);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+dur+0.05);
}
function sfxThump(vol=1,pitch=1){if(!sfxOK()||vol<0.02)return;const t=audioCtx.currentTime;sfxNoise(t,0.13,'lowpass',600*pitch,120*pitch,0.9*vol);sfxTone(t,'sine',120*pitch,45*pitch,0.18,0.9*vol)}
function sfxWhoosh(vol=1){if(!sfxOK())return;sfxNoise(audioCtx.currentTime,0.35,'bandpass',500,2200,0.3*vol,2)}
function sfxTag(vol=1){if(!sfxOK()||vol<0.02)return;const t=audioCtx.currentTime;sfxTone(t,'sawtooth',750,140,0.3,0.5*vol);sfxTone(t+0.02,'square',380,90,0.32,0.25*vol);sfxNoise(t,0.1,'highpass',2500,2500,0.25*vol)}
function sfxStart(){if(!sfxOK())return;const t=audioCtx.currentTime;[440,660,880].forEach((f,i)=>sfxTone(t+i*0.13,'triangle',f,f,0.14,0.35))}
function sfxOver(){if(!sfxOK())return;const t=audioCtx.currentTime;[880,660,440,330].forEach((f,i)=>sfxTone(t+i*0.14,'triangle',f,f,0.16,0.35))}
function sfxJoin(){if(!sfxOK())return;const t=audioCtx.currentTime;sfxTone(t,'sine',600,600,0.1,0.3);sfxTone(t+0.1,'sine',900,900,0.15,0.3)}
function sfxLeave(){if(!sfxOK())return;const t=audioCtx.currentTime;sfxTone(t,'sine',900,900,0.1,0.25);sfxTone(t+0.1,'sine',600,600,0.15,0.25)}
function sfxClick(){if(!sfxOK())return;sfxTone(audioCtx.currentTime,'square',1100,1100,0.05,0.2)}
let lastHit=0,lastLand=0,lastWhoosh=0;
function handHit(k,speed){if(P.ht[k])return;P.ht[k]=true;const n=performance.now();if(n-P.htT[k]<150)return;P.htT[k]=n;sfxThump(Math.min(1,0.3+speed*0.15))}
function landSfx(v){const n=performance.now();if(n-lastLand<250)return;lastLand=n;sfxThump(Math.min(1,v/12),0.6)}
function whooshSfx(speed){const n=performance.now();if(speed<3.5||n-lastWhoosh<200)return;lastWhoosh=n;sfxWhoosh(Math.min(1,speed/10))}

const TAG_DIST=1.3,HAND_TAG=0.65,HEAD_START=5000,OVER_TIME=6000;
const game={mode:'free',phase:'wait',tagged:new Set(),eliminated:new Set(),winner:null,msg:'',hsEnd:0,overAt:0,syncT:0};
const lastStanding=()=>allIds().length>=4;
const myId=()=>net&&net.peer?net.peer.id:null,isHost=()=>!!(net&&net.host);
const allIds=()=>{const a=[];if(myId())a.push(myId());remotes.forEach((r,id)=>a.push(id));return a};
function gameState(extra){return Object.assign({t:'g',mode:game.mode,phase:game.phase,tagged:[...game.tagged],eliminated:[...game.eliminated],winner:game.winner,msg:game.msg,hs:Math.max(0,game.hsEnd-performance.now())},extra||{})}
function sendGame(extra){netSend(gameState(extra));if(extra&&extra.ev)gameEvent(extra.ev,extra.v);refreshGM()}
function applyGame(d){
  if(net&&net.host)return;
  game.mode=d.mode;game.phase=d.phase;game.tagged=new Set(d.tagged||[]);game.eliminated=new Set(d.eliminated||[]);game.winner=d.winner||null;game.msg=d.msg||'';
  if(d.hs!==undefined)game.hsEnd=performance.now()+d.hs;
  if(d.ev)gameEvent(d.ev,d.v);refreshGM();
}
function buzz(){[0,1].forEach(k=>{try{pulse(byHand[k]&&byHand[k].gp)}catch(e){}})}
function gameEvent(ev,v){
  if(ev==='tag'){const me=myId(),r=remotes.get(v);sfxTag(v===me?1:(r?distGain(r.pos):0.4));if(v===me)buzz()}
  else if(ev==='start')sfxStart();else if(ev==='over')sfxOver();else if(ev==='mode')sfxClick();
}
function startRound(){
  const ids=allIds();
  if(ids.length<2){game.phase='wait';game.tagged.clear();game.msg='';sendGame();return}
  game.tagged=new Set([ids[Math.floor(Math.random()*ids.length)]]);game.eliminated.clear();game.winner=null;game.phase='play';game.hsEnd=performance.now()+HEAD_START;
  sendGame({ev:'start'});
}
function hostSetMode(m){
  if(!isHost()||m===game.mode)return;
  game.mode=m;game.tagged.clear();game.eliminated.clear();game.winner=null;game.phase='wait';game.msg='';
  if(m==='tag'&&allIds().length>=2)startRound();else sendGame({ev:'mode'});
}
function playersInfo(){
  const w=k=>P.g.rig.wrist[k].getWorldPosition(V()),me={id:myId(),pos:P.g.group.position.clone(),hands:[w(0),w(1)]};
  return [me,...[...remotes].map(([id,r])=>({id,pos:r.pos,hands:r.h}))];
}
function hostTick(dt){
  game.syncT-=dt;if(game.syncT<=0){game.syncT=2;netSend(gameState())}   // re-broadcast now and then so nobody gets stuck out of sync
  if(game.mode!=='tag')return;
  const ids=allIds(),now=performance.now();
  [...game.tagged].forEach(id=>{if(!ids.includes(id))game.tagged.delete(id)});
  if(game.phase==='wait'){if(ids.length>=2)startRound();return}
  if(game.phase==='over'){if(now>game.overAt)startRound();return}
  if(ids.length<2){game.phase='wait';game.tagged.clear();game.eliminated.clear();game.winner=null;sendGame();return}
  if(game.tagged.size===0){startRound();return}
  if(now<game.hsEnd)return;   // the first tagged player gets a short head start
  const pl=playersInfo(),survivors=pl.filter(p=>!game.eliminated.has(p.id));
  // With four players, a tagged player is out. With three or fewer, tag spreads like infection.
  for(const a of survivors)if(game.tagged.has(a.id)&&(!lastStanding()||!game.eliminated.has(a.id)))for(const b of survivors){
    if(a.id===b.id||game.tagged.has(b.id)||game.eliminated.has(b.id))continue;
    if(a.pos.distanceTo(b.pos)<TAG_DIST||a.hands.some(h=>h.distanceTo(b.pos)<HAND_TAG)){
      if(lastStanding())game.eliminated.add(b.id);else game.tagged.add(b.id);
      sendGame({ev:'tag',v:b.id});
      if(lastStanding()&&ids.length-game.eliminated.size<=1){game.winner=pl.find(p=>!game.eliminated.has(p.id))?.id||a.id;game.phase='over';game.msg='Last one standing wins!';game.overAt=now+OVER_TIME;sendGame({ev:'over'})}
      else if(!lastStanding()&&game.tagged.size>=ids.length){game.msg='Everyone is tagged! Keep playing';sendGame()}

    if(b.id==='mic'){col=micOn?'#3ecf6a':'#d9534f';fg=micOn?'#000':'#fff';txt='Mic: '+(micOn?(micOK===false?'ON (no mic)':'ON'):'OFF')}
    else if(b.id==='hear'){col=hearOn?'#3ecf6a':'#d9534f';fg=hearOn?'#000':'#fff';txt='Hear others: '+(hearOn?'ON':'OFF')}
    else if(b.id==='sfx'){col=sfxOn?'#3ecf6a':'#d9534f';fg=sfxOn?'#000':'#fff';txt='Sounds: '+(sfxOn?'ON':'OFF')}
    else if(b.id==='turn'){col=turnMode?'#3b82f6':'#666';txt='Turning: '+TURN_NAMES[turnMode]}
    else if(b.id==='mode'){col=isHost()?'#b45309':'#444';txt='Game mode: '+(game.mode==='tag'?'TAG':'CASUAL')+(isHost()?'':' (host only)')}
    else if(b.id==='cam'){col='#8b5cf6';txt='Bring camera to me'}
    x.fillStyle=col;rr(b.x,b.y,b.w,b.h,12);x.fill();
    if(i===menuHover){x.strokeStyle='#fff';x.lineWidth=4;rr(b.x,b.y,b.w,b.h,12);x.stroke()}
    x.fillStyle=fg;x.font='bold 19px Utopium, sans-serif';x.fillText(txt,b.x+b.w/2,b.y+b.h/2+6);
  });
  menuTex.needsUpdate=true;
}
const ctrls=[0,1].map(i=>renderer.xr.getController(i));
const lasers=ctrls.map(c=>{const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(),V(0,0,-1)]),new THREE.LineBasicMaterial({color:0xffd54a,fog:false}));l.visible=false;c.add(l);return l});
const _rc=new THREE.Raycaster(),_mo=V(),_md=V(),_mq=new THREE.Quaternion();
function setMenu(on){
  if(on===menuOpen)return;menuOpen=on;menuG.visible=on;lasers.forEach(l=>l.visible=on);
  if(!on)return;
  const xc=renderer.xr.getCamera();rig.localToWorld(_mo.copy(xc.position));_mq.copy(rig.quaternion).multiply(xc.quaternion);
  _md.set(0,0,-1).applyQuaternion(_mq);_md.y=0;if(_md.lengthSq()<1e-4)_md.set(0,0,-1);_md.normalize();
  menuG.position.copy(_mo).addScaledVector(_md,1);menuG.position.y=_mo.y-0.05;
  menuG.lookAt(_mo.x,menuG.position.y,_mo.z);menuG.updateMatrixWorld(true);
  menuHover=-1;menuDrawKey='';drawMenu();
}
const pulse=gp=>{try{const a=gp&&gp.hapticActuators&&gp.hapticActuators[0];if(a&&a.pulse)a.pulse(0.4,40)}catch(e){}};
function menuClick(id){
  if(id==='mic')setMic(!micOn);
  else if(id==='hear')setHear(!hearOn);
  else if(id==='sfx'){setSfx(!sfxOn);if(sfxOn)sfxClick()}
  else if(id==='turn'){turnMode=(turnMode+1)%3;vrSnap=false;try{localStorage.setItem('monkeTurn',turnMode)}catch(e){}}
  else if(id==='mode'){if(isHost())hostSetMode(game.mode==='tag'?'free':'tag')}
  else if(id==='cam'){camBring();setMenu(false)}
  else if(id==='close')setMenu(false);
}
function vrMenuTick(dt){
  if(!renderer.xr.isPresenting){if(menuOpen)setMenu(false);return}
  const gp0=byHand[0]&&byHand[0].gp;
  // Menu toggle: ONLY the three-line/menu control reported by the LEFT controller.
  // Never use grip buttons as a substitute. WebXR/browser mappings vary, so inspect
  // the extra left-controller buttons (index 6 onward) where that control may appear.
  let req=false;
  if(gp0) for(let i=6;i<gp0.buttons.length;i++) if(gp0.buttons[i]&&gp0.buttons[i].pressed) req=true;
  if(!mArm){if(!req)mArm=true;mPrevReq=req}else{if(req&&!mPrevReq)setMenu(!menuOpen);mPrevReq=req}
  if(!menuOpen)return;
  let hov=-1;
  for(let i=0;i<2;i++){
    const c=ctrls[i],hk=byHand[0]&&byHand[0].grip===grips[i]?0:(byHand[1]&&byHand[1].grip===grips[i]?1:-1);
    const gp=hk>=0?byHand[hk].gp:null,tr=!!(gp&&gp.buttons[0]&&gp.buttons[0].pressed),press=tr&&!mPrevTrig[i];mPrevTrig[i]=tr;
    c.updateMatrixWorld(true);_mo.setFromMatrixPosition(c.matrixWorld);_md.set(0,0,-1).transformDirection(c.matrixWorld);_rc.set(_mo,_md);
    const h=_rc.intersectObject(menuMesh,false)[0];let len=2.5/rig.scale.x;
    if(h){
      len=h.distance/rig.scale.x;
      // Convert the real ray-hit point into menu-local coordinates. UV x can be mirrored on a DoubleSide back-face hit.
      const localHit=menuMesh.worldToLocal(h.point.clone());
      const px=(localHit.x+0.5)*MW,py=MH/2-localHit.y*MW;
      const bi=MBTN.findIndex(b=>px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h);
      if(bi>=0){hov=bi;if(press){pulse(gp);menuClick(MBTN[bi].id);if(!menuOpen)return}}
    }
    lasers[i].scale.z=len;
  }
  menuHover=hov;drawMenu();
}
renderer.xr.addEventListener('sessionend',()=>setMenu(false));
renderer.xr.addEventListener('sessionstart',()=>{mArm=false;mPrevReq=false;const ss=renderer.xr.getSession();if(ss)ss.addEventListener('visibilitychange',()=>{mArm=false;mPrevReq=false;setMenu(false)})});
ctrls.forEach(c=>{c.addEventListener('connected',()=>{mArm=false;mPrevReq=false});c.addEventListener('disconnected',()=>{mArm=false;mPrevReq=false})});

// ---------- Camera rig (ported from Gorilla Cam Lab) ----------
// Grab with GRIP next to a handle (both handles = two-hand hold). Let go and it floats like a tripod.
// Buttons are pressed with the hand LASER + TRIGGER, same as the menu. While holding: TRIGGER = photo, right stick up/down = FOV.
let camTick=()=>{},camBring=()=>{};
{
const HX=.31,MODES=['THIRD','FIRST','SELFIE'],CS=VS;
const cst={mode:0,fov:70,rec:false};
const A=V(),B=V(),X=V(),Y=V(),Z=V(),U1=V(),U2=V(),TS=V(),Q=new THREE.Quaternion(),MM=new THREE.Matrix4();
const r2=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r2.setSize(960,540,false);
const cv2=r2.domElement;
const tex=new THREE.CanvasTexture(cv2);tex.minFilter=THREE.LinearFilter;tex.generateMipmaps=false;tex.colorSpace=THREE.SRGBColorSpace;
const cm=new THREE.Group();cm.scale.setScalar(CS);cm.visible=false;scene.add(cm);
const dark=new THREE.MeshStandardMaterial({color:0x22262e,roughness:.5});
const body=new THREE.Mesh(new THREE.BoxGeometry(.54,.4,.06),dark);cm.add(body);
const lens=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.05,20),new THREE.MeshStandardMaterial({color:0x0a0a0a,metalness:.6,roughness:.2}));
lens.rotation.x=Math.PI/2;lens.position.set(0,.03,-.045);cm.add(lens);
[-1,1].forEach(s=>{const hd=new THREE.Mesh(new THREE.CylinderGeometry(.022,.022,.18,14),new THREE.MeshStandardMaterial({color:s>0?0xff5a5a:0x4c7dff,roughness:.4}));hd.position.x=s*HX;cm.add(hd)});
const screen=new THREE.Mesh(new THREE.PlaneGeometry(.46,.259),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide,fog:false}));
screen.position.set(0,.03,.033);cm.add(screen);
const flashM=new THREE.Mesh(new THREE.PlaneGeometry(.46,.259),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,fog:false}));
flashM.position.set(0,.03,.0345);flashM.visible=false;cm.add(flashM);
function label(w,h,px,py,font){
  const c=document.createElement('canvas');c.width=px;c.height=py;const x=c.getContext('2d'),t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,fog:false}));
  m.draw=(txt,bg,fg)=>{x.fillStyle=bg;x.fillRect(0,0,px,py);x.fillStyle=fg;x.font=font;x.textAlign='center';x.textBaseline='middle';x.fillText(txt,px/2,py/2);t.needsUpdate=true};
  return m;
}
const info=label(.46,.04,460,40,'bold 24px sans-serif');info.position.set(0,.18,.033);cm.add(info);
const buttons=[['photo','PHOTO'],['rec','REC'],['mode','MODE'],['flip','FLIP'],['fovm','FOV-'],['fovp','FOV+']].map((d,i)=>{
  const b=label(.065,.05,130,100,'bold 30px sans-serif');b.position.set((i-2.5)*.075,-.15,.035);
  b.userData={id:d[0],txt:d[1],t:0,k:''};cm.add(b);return b;
});
const hitObjs=[body,...buttons];
let infoKey='';
function ui(){
  buttons.forEach(b=>{const u=b.userData,on=u.t>0||(u.id==='rec'&&cst.rec)||(u.id==='flip'&&cst.mode===2),txt=u.id==='rec'&&cst.rec?'STOP':u.txt,k=txt+on;
    if(k!==u.k){u.k=k;b.draw(txt,on?(u.id==='rec'?'#d11a2a':'#2a9df4'):'#2a3140','#fff')}});
  const t=MODES[cst.mode]+'   FOV '+Math.round(cst.fov)+'°'+(cst.rec?'   ● REC':'');
  if(t!==infoKey){infoKey=t;info.draw(t,'#10131a','#9ee7ff')}
}

/* ---- hands / grabbing ---- */
const buzz=(h,a,ms)=>{try{const g=h.src&&h.src.gamepad,p=g&&g.hapticActuators&&g.hapticActuators[0];if(p&&p.pulse)p.pulse(a,ms)}catch(e){}};
const hs=[0,1].map(i=>{
  const h={ctrl:ctrls[i],grip:grips[i],src:null,hold:null,off:new THREE.Matrix4(),prevTrig:false};
  h.ctrl.addEventListener('connected',e=>{h.src=e.data});
  h.ctrl.addEventListener('disconnected',()=>{h.src=null;h.hold=null});
  h.ctrl.addEventListener('squeezestart',()=>grab(h));
  h.ctrl.addEventListener('squeezeend',()=>release(h));
  return h;
});
function grab(h){
  if(h.hold||!renderer.xr.isPresenting||!cm.visible)return;
  rig.updateMatrixWorld(true);cm.updateMatrixWorld(true);h.grip.getWorldPosition(A);
  let best=0,bd=.14*CS;
  for(const s of [-1,1]){
    if(hs.some(o=>o.hold&&o.hold.side===s))continue;
    const d=A.distanceTo(cm.localToWorld(B.set(s*HX,0,0)));if(d<bd){bd=d;best=s}
  }
  if(best){h.hold={side:best};h.off.copy(h.grip.matrixWorld).invert().multiply(cm.matrixWorld);buzz(h,.6,60)}
}
function release(h){
  h.hold=null;rig.updateMatrixWorld(true);
  const o=hs.find(k=>k.hold);if(o)o.off.copy(o.grip.matrixWorld).invert().multiply(cm.matrixWorld);
}
function updateCam(){
  const hh=hs.filter(h=>h.hold);
  if(hh.length===1){MM.multiplyMatrices(hh[0].grip.matrixWorld,hh[0].off);MM.decompose(cm.position,cm.quaternion,TS)}
  else if(hh.length===2){
    const R=hh.find(h=>h.hold.side>0),L=hh.find(h=>h.hold.side<0);
    R.grip.getWorldPosition(A);L.grip.getWorldPosition(B);
    X.subVectors(A,B).normalize();
    U1.set(0,1,0).applyQuaternion(R.grip.getWorldQuaternion(Q));U2.set(0,1,0).applyQuaternion(L.grip.getWorldQuaternion(Q));
    Y.set(0,2,0).add(U1).add(U2);
    Z.crossVectors(X,Y).normalize();Y.crossVectors(Z,X);
    MM.makeBasis(X,Y,Z);cm.quaternion.setFromRotationMatrix(MM);cm.position.addVectors(A,B).multiplyScalar(.5);
  }
  cm.updateMatrixWorld(true);
}

/* ---- head pose + spawn ---- */
const hq=new THREE.Quaternion(),hp=V();let placed=false;
function headPose(){const xc=renderer.xr.getCamera();rig.localToWorld(hp.copy(xc.position));hq.copy(rig.quaternion).multiply(xc.quaternion)}
function placeCam(){
  B.set(0,0,-1).applyQuaternion(hq);B.y=0;if(B.lengthSq()<1e-4)B.set(0,0,-1);B.normalize();
  cm.position.set(hp.x+B.x*1.26,hp.y-.35,hp.z+B.z*1.26);
  cm.lookAt(cm.position.x-B.x,cm.position.y,cm.position.z-B.z); // screen faces you, lens faces away
  cm.updateMatrixWorld(true);hs.forEach(h=>h.hold=null);
}
camBring=()=>{rig.updateMatrixWorld(true);headPose();placeCam()};

/* ---- camera view / photo / record ---- */
const c2=new THREE.PerspectiveCamera(70,16/9,.05,500),qFlip=new THREE.Quaternion().setFromAxisAngle(V(0,1,0),Math.PI);
function renderCam(){
  if(cst.mode===1){c2.position.copy(hp);c2.quaternion.copy(hq)}
  else{c2.position.copy(cm.localToWorld(A.set(0,.03,cst.mode===2?.04:-.04)));c2.quaternion.copy(cm.quaternion);if(cst.mode===2)c2.quaternion.multiply(qFlip)}
  c2.fov=cst.fov;c2.updateProjectionMatrix();
  const hv=hudPlane.visible,mv=menuG.visible,lv=lasers.map(l=>l.visible);
  cm.visible=false;menuG.visible=false;hudPlane.visible=false;lasers.forEach(l=>l.visible=false);
  r2.render(scene,c2);
  cm.visible=true;menuG.visible=mv;hudPlane.visible=hv;lasers.forEach((l,i)=>l.visible=lv[i]);
  tex.needsUpdate=true;
}
/* captures list (page overlay) + save */
const gb=document.createElement('button');gb.textContent='📷 Captures';
gb.style.cssText='position:fixed;left:16px;bottom:16px;z-index:30;padding:8px 12px;border:0;border-radius:8px;background:#000b;color:#fff;font:14px system-ui,sans-serif;cursor:pointer;display:none';
const gal=document.createElement('div');
gal.style.cssText='position:fixed;left:16px;bottom:56px;z-index:30;width:min(520px,90vw);max-height:60vh;overflow:auto;background:#000d;border-radius:12px;padding:10px;display:none;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;color:#fff;font:13px system-ui,sans-serif';
gb.onclick=()=>{gal.style.display=gal.style.display==='grid'?'none':'grid'};
document.body.append(gb,gal);
const dbp=new Promise(res=>{try{const r=indexedDB.open('gcam',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'name'});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
function addItem(blob,name){
  const url=URL.createObjectURL(blob),d=document.createElement('div'),vid=blob.type.startsWith('video');
  d.innerHTML=(vid?'<video controls src="'+url+'" style="width:100%;border-radius:6px"></video>':'<img src="'+url+'" style="width:100%;border-radius:6px">')+'<a download="'+name+'" href="'+url+'" style="color:#ffd54a">Download</a>';
  gal.prepend(d);gb.style.display='block';return url;
}
function saveFile(blob,name){
  const url=addItem(blob,name);
  try{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}
  dbp.then(db=>{if(db)try{db.transaction('f','readwrite').objectStore('f').put({name,blob,t:Date.now()})}catch(e){}});
}
dbp.then(db=>{if(!db)return;const r=db.transaction('f').objectStore('f').getAll();
  r.onsuccess=()=>r.result.sort((p,q)=>p.t-q.t).forEach(f=>addItem(f.blob,f.name))});
let flash=0,mr=null,chunks=[];
function photo(){
  renderCam();flash=.18;
  cv2.toBlob(b=>{if(b)saveFile(b,'monke-photo-'+Date.now()+'.jpg')},'image/jpeg',.92);
}
function toggleRec(){
  if(!cst.rec){
    const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
    if(!mime)return;
    chunks=[];mr=new MediaRecorder(cv2.captureStream(30),{mimeType:mime,videoBitsPerSecond:5e6});
    mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    mr.onstop=()=>{const ty=mime.split(';')[0];saveFile(new Blob(chunks,{type:ty}),'monke-clip-'+Date.now()+'.'+(ty.includes('mp4')?'mp4':'webm'))};
    mr.start(1000);cst.rec=true;
  }else{mr.stop();cst.rec=false}
}
function press(id){
  if(id==='photo')photo();else if(id==='rec')toggleRec();
  else if(id==='mode')cst.mode=(cst.mode+1)%3;
  else if(id==='flip')cst.mode=cst.mode===2?0:2;
}

/* ---- per-frame ---- */
const rc2=new THREE.Raycaster();rc2.far=3.5;
const aim=[false,false],aimLen=[1,1];let camAcc=0;
camTick=function(dt){
  const xr=renderer.xr.isPresenting;
  cm.visible=xr;
  if(!xr){hs.forEach(h=>{h.hold=null});placed=false;if(cst.rec)toggleRec();return}
  rig.updateMatrixWorld(true);headPose();
  if(!placed){placeCam();placed=true}
  updateCam();
  // right stick up/down = FOV while holding the camera
  const g1=byHand[1]&&byHand[1].gp;
  if(hs.some(h=>h.hold)&&g1&&g1.axes&&g1.axes.length>=4&&Math.abs(g1.axes[3])>.2)cst.fov+=g1.axes[3]*40*dt;
  // trigger: photo (holding hand) / laser-press on camera buttons (free hand)
  for(let i=0;i<2;i++){
    const h=hs[i],gp=h.src&&h.src.gamepad,tr=!!(gp&&gp.buttons[0]&&gp.buttons[0].pressed),edge=tr&&!h.prevTrig;h.prevTrig=tr;
    aim[i]=false;
    if(menuOpen)continue;
    if(h.hold){if(edge)photo();continue}
    h.ctrl.updateMatrixWorld(true);A.setFromMatrixPosition(h.ctrl.matrixWorld);B.set(0,0,-1).transformDirection(h.ctrl.matrixWorld);rc2.set(A,B);
    const hit=rc2.intersectObjects(hitObjs,false)[0];
    if(hit){
      aim[i]=true;aimLen[i]=hit.distance/rig.scale.x;
      const u=hit.object.userData;
      if(u&&u.id){
        u.t=.12;
        if(u.id==='fovm'){if(tr)cst.fov-=40*dt}
        else if(u.id==='fovp'){if(tr)cst.fov+=40*dt}
        else if(edge){press(u.id);buzz(h,.5,40)}
      }
    }
  }
  for(let i=0;i<2;i++){lasers[i].visible=menuOpen||aim[i];if(!menuOpen&&aim[i])lasers[i].scale.z=aimLen[i]}
  cst.fov=Math.max(15,Math.min(120,cst.fov));
  buttons.forEach(bt=>{if(bt.userData.t>0)bt.userData.t-=dt});
  if(flash>0){flash-=dt;flashM.visible=true;flashM.material.opacity=Math.max(flash/.18,0);if(flash<=0)flashM.visible=false}
  ui();
  // camera screen at ~24fps, only when it's nearby or recording
  camAcc+=dt;
  if(camAcc>=1/24&&(cst.rec||cm.position.distanceTo(hp)<8)){camAcc=0;renderCam()}
};
}

const clock=new THREE.Clock();let t=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),1/30);t+=dt;
  if(renderer.xr.isPresenting)stepVR(dt);else stepPlayer(dt);
  if(P.g.spin)P.g.spin.rotation.y+=dt*25;
  furTick(t);stepRemotes(dt);netTick(dt);gameTick(dt);voiceTick();vrMenuTick(dt);camTick(dt);
  const f=V(-Math.sin(P.yaw),0,-Math.cos(P.yaw));
  if(renderer.xr.isPresenting){}
  else if(P.third){cam.position.copy(P.pos).addScaledVector(f,-3.2*SIZE).add(V(0,1.4*SIZE,0));cam.lookAt(P.pos)}
  else{cam.position.copy(P.g.group.localToWorld(V(0,0.5,0.28)));cam.rotation.set(P.pitch,P.yaw,0,'YXZ')}
  $('sub').textContent=`Speed: ${P.vel.length().toFixed(1)} m/s`;
  renderer.render(scene,cam);
});
